<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunas Dedication Photos</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; max-width: 480px; margin: auto; }
    button { padding: 15px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; background-color: #007bff; color: white; border: none; width: 100%; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Capture This Moment Through Your Lens</h2>
  <p>Shots remaining: <span id="remaining">20</span>/20</p>
  
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" />
  <button id="snapBtn" onclick="triggerCamera()">Take Photo</button>
  <p id="status"></p>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS5jYm_DButsMQ82RlALcGXZzfdyCdpDbL4qoRc_mttfyKbA0H2d9c9Peyz6MEjEFk/exec";
    const MAX_SHOTS = 20;

    function getShotCount() {
      return parseInt(localStorage.getItem('shotsTaken') || '0', 10);
    }

    function updateUI() {
      const taken = getShotCount();
      const remaining = Math.max(0, MAX_SHOTS - taken);
      document.getElementById('remaining').innerText = remaining;
      
      if (remaining <= 0) {
        const btn = document.getElementById('snapBtn');
        btn.disabled = true;
        btn.innerText = "Limit Reached (20/20)";
      }
    }

    function triggerCamera() {
      if (getShotCount() >= MAX_SHOTS) {
        alert("You have reached your 20-photo limit!");
        return;
      }
      document.getElementById('cameraInput').click();
    }

    // Canvas resize function to keep payload within Apps Script limits
    function compressImage(file, maxWidth = 1600, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(dataUrl.split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('cameraInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const taken = getShotCount();
      if (taken >= MAX_SHOTS) return;

      const snapBtn = document.getElementById('snapBtn');
      const statusEl = document.getElementById('status');
      
      snapBtn.disabled = true;
      statusEl.innerText = "Processing and uploading...";

      try {
        const base64Data = await compressImage(file);
        const payload = {
          base64: base64Data,
          mimeType: "image/jpeg",
          filename: `photo_${Date.now()}.jpg`
        };

        // Use text/plain with no-cors to reliably reach Google Apps Script
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        localStorage.setItem('shotsTaken', taken + 1);
        updateUI();
        statusEl.innerText = "Uploaded successfully!";
      } catch (err) {
        statusEl.innerText = "Upload failed. Try again.";
      } finally {
        // Reset file input so users can take another picture right away
        event.target.value = '';
        if (getShotCount() < MAX_SHOTS) {
          snapBtn.disabled = false;
        }
      }
    });

    updateUI();
  </script>
</body>
</html>
